[build]
  command = "npx -y pnpm@10.30.3 install --frozen-lockfile && npx -y pnpm@10.30.3 run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_FLAGS = "--frozen-lockfile"

# Website là một trang (SPA): mọi đường dẫn đều trả về index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  NEXT_PUBLIC_API_URL = "https://api.greenseed.example"

[context.develop.environment]
  NEXT_PUBLIC_API_URL = "https://api-staging.greenseed.example"

[context.deploy-preview.environment]
  NEXT_PUBLIC_API_URL = "https://api-staging.greenseed.example"
