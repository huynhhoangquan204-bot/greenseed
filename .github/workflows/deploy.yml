name: Deploy GitHub Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_PAGES: "1"
      VITE_FIREBASE_API_KEY: AIzaSyA-atTwMmSStcoa2i7o1rGQyap-3yOjk70
      VITE_FIREBASE_AUTH_DOMAIN: greenseed-website.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: greenseed-website
      VITE_FIREBASE_STORAGE_BUCKET: greenseed-website.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "401007680586"
      VITE_FIREBASE_APP_ID: 1:401007680586:web:b0f8f9e20af13c31891ab3
      VITE_ADMIN_EMAIL: huynhhoangquan204@gmail.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
